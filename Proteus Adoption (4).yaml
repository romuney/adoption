  - sid: 01a16034-7e4b-71e3-95a7-a1c24c3b7b1f
    title: Перенос избранных дашбордов в GP (временная таблица)
    shebang: python
    code: |-
      from dal_client import query as dal

      # 1. Читаем избранные дашборды из DLH
      df = dal.get_df(
          datasource='dlh',
          query="""
              SELECT user_id, obj_id AS dashboard_id, dttm
              FROM prod_chrono_proteus_web.favstar_proteus_prod
              WHERE class_name = 'Dashboard'
          """,
      )

      print(f'rows={len(df)}, columns={len(df.columns)}')

      # 2. Записываем во временную таблицу GP
      dal.put_df(
          df=df,
          table='favstar_dashboards',
          datasource='gp',
          if_exists='replace',
      )

      print('Записано во временную таблицу GP: favstar_dashboards')
    isEnabled: false
