sql: "select\n{% if filter_values('period_column')|first == '30 \u0434\u043D\u0435\
  \u0439'%} \ndate_trunc('day',log_dttm) \n{% elif '20 \u043D\u0435\u0434\u0435\u043B\
  \u044C' == filter_values('period_column')|first %} \ndate_trunc('week',log_dttm)\
  \ \n{% elif filter_values('period_column')|first == '12 \u043C\u0435\u0441\u044F\
  \u0446\u0435\u0432'%} \ndate_trunc('month',log_dttm) \n{% elif filter_values('period_column')|first\
  \ == '8 \u043A\u0432\u0430\u0440\u0442\u0430\u043B\u043E\u0432'%} \ndate_trunc('quarter',log_dttm)\
  \ \n{% else %}\ndate_trunc('day',log_dttm)\n{% endif %} as log_param_dt\n, count(distinct\
  \ user_id) as user_cnt\n, COUNT(distinct user_id) filter \n{% if filter_values('period_column')|first\
  \ == '30 \u0434\u043D\u0435\u0439'%} \n(where date_trunc('day',log_dttm) = date_trunc('day',first_action))\n\
  {% elif '20 \u043D\u0435\u0434\u0435\u043B\u044C' == filter_values('period_column')|first\
  \ %} \n(where date_trunc('week',log_dttm) = date_trunc('week',first_action))\n{%\
  \ elif filter_values('period_column')|first == '12 \u043C\u0435\u0441\u044F\u0446\
  \u0435\u0432'%} \n(where date_trunc('month',log_dttm) = date_trunc('month',first_action))\n\
  {% elif filter_values('period_column')|first == '8 \u043A\u0432\u0430\u0440\u0442\
  \u0430\u043B\u043E\u0432'%} \n(where date_trunc('quarter',log_dttm) = date_trunc('quarter',first_action))\n\
  {% else %}\n(where date_trunc('day',log_dttm) = date_trunc('day',first_action))\n\
  {% endif %} as new_user_cnt\n, sum(action_count) as action_cnt\nfrom \n{{dataset(35153)}}\n\
  where \n1=1\nand {% if filter_values('period_column')|first == '30 \u0434\u043D\u0435\
  \u0439'%} \nlog_dttm between date_add(DAY, -30,  max_date) and max_date\n{% elif\
  \ filter_values('period_column')|first == '20 \u043D\u0435\u0434\u0435\u043B\u044C\
  '%} \nlog_dttm between date_add(WEEk, -20, max_date) and max_date\n{% elif filter_values('period_column')|first\
  \ == '12 \u043C\u0435\u0441\u044F\u0446\u0435\u0432'%} \nlog_dttm between date_add(MONTH,\
  \ -11 , date_trunc('month',max_date)) and max_date\n{% elif filter_values('period_column')|first\
  \ == '8 \u043A\u0432\u0430\u0440\u0442\u0430\u043B\u043E\u0432'%} \nlog_dttm between\
  \ date_add(QUARTER, -8 , max_date) and max_date\n{% else %}\nlog_dttm between date_add(DAY,\
  \ -30, max_date) and max_date\n{% endif %}\ngroup by \n{% if filter_values('period_column')|first\
  \ == '30 \u0434\u043D\u0435\u0439'%} \ndate_trunc('day',log_dttm) \n{% elif filter_values('period_column')|first\
  \ == '20 \u043D\u0435\u0434\u0435\u043B\u044C'%} \ndate_trunc('week',log_dttm) \n\
  {% elif filter_values('period_column')|first == '12 \u043C\u0435\u0441\u044F\u0446\
  \u0435\u0432'%} \ndate_trunc('month',log_dttm) \n{% elif filter_values('period_column')|first\
  \ == '8 \u043A\u0432\u0430\u0440\u0442\u0430\u043B\u043E\u0432'%} \ndate_trunc('quarter',log_dttm)\
  \ \n{% else %}\ndate_trunc('day',log_dttm)\n{% endif %} \n"
