schema: prod_proteus
sql: "\nSELECT\n    cohort_month,\n    age,\n    active_users,\n    max(if(age = 0,\
  \ active_users, 0)) OVER (PARTITION BY cohort_month) AS cohort_size,\n    max_date\n\
  FROM\n(\n    SELECT\n        date_trunc('month', first_action)                 \
  \             AS cohort_month,\n        dateDiff('month', date_trunc('month', first_action),\n\
  \                          date_trunc('month', log_dttm))                AS age,\n\
  \        toInt64(uniqExact(user_id))                                     AS active_users,\n\
  \        max_date\n    FROM {{dataset(35153)}}\n    WHERE first_action >= date_add(YEAR,\
  \ -3, date_trunc('month', max_date))\n    GROUP BY cohort_month, age, max_date\n\
  \    HAVING age >= 0 AND age <= 24\n)\nORDER BY cohort_month, age;\n"
