<!DOCTYPE html>
 lang="ru"><head><meta charset="utf-8"><title>Полоска настроек — эталон из <bodyмакета</title></head>
>
<!-- Эталон: рендер зоны strip макета (Макет/assets/app.js strip()+optsPop(), вкладка reports, состояние по умолчанию, поповер ОТКРЫТ руками для реестра). Источник стилей: Макет/assets/app.css (.strip/.strip-seg/.opts/.opts-pop/.swt/.chips) -->
<div class="strip"><div class="strip-seg" role="group" aria-label="Период"><button data-grain="d" class="on">30 дней</button><button data-grain="w">20 недель</button><button data-grain="m">12 месяцев</button><button data-grain="q">8 кварталов</button></div><div class="opts open"><button class="opts-trg" data-ddtoggle="opts" aria-expanded="true" data-tip="&lt;span class=&quot;t-h&quot;&gt;Опции&lt;/span&gt;&lt;span class=&quot;t-x&quot;&gt;Свитки качества отчётов. Период — слева; фильтры по людям — кликами по строкам «Кто смотрит»; отчётные условия — выбором в каталоге.&lt;/span&gt;">Опции <span class="st-c" aria-hidden="true">▾</span></button><div class="opts-pop"><label class="swt"><input type="checkbox" data-f="published" checked><span>Только опубликованные</span></label><label class="swt"><input type="checkbox" data-f="actual" checked><span>Только актуальные</span></label><label class="swt"><input type="checkbox" data-f="excludeOwners" checked><span>Исключить владельцев из просмотров <span class="info" data-tip="&lt;span class=&quot;t-x&quot;&gt;Владелец открывает свой отчёт при каждой правке — его визиты завышают аудиторию.&lt;/span&gt;">i</span></span></label></div></div><span class="strip-hint">активные условия — чипами над каталогом</span><span class="sp"></span><button class="btn ghost" id="fltReset">Сбросить всё</button></div>
</body></html>
